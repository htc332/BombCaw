<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>炸弹牛日志查看器</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #d4d4d4; }
    h1 { color: #fff; }
    #logs { white-space: pre-wrap; background: #252526; padding: 15px; border-radius: 5px; min-height: 300px; }
    .error { color: #f48771; }
    .warn { color: #cca700; }
    .info { color: #4fc1ff; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #0e639c; color: white; border: none; border-radius: 3px; }
    button:hover { background: #1177bb; }
  </style>
</head>
<body>
  <h1>炸弹牛日志查看器</h1>
  <div>
    <button onclick="loadLogs()">刷新日志</button>
    <button onclick="clearLogs()">清空日志</button>
  </div>
  <div id="logs">点击"刷新日志"查看...</div>
  
  <script>
    function loadLogs() {
      try {
        if (typeof GameGlobal !== 'undefined' && GameGlobal.getConsoleLogs) {
          const logs = GameGlobal.getConsoleLogs();
          document.getElementById('logs').textContent = logs || '暂无日志';
        } else {
          document.getElementById('logs').textContent = 'GameGlobal 不可用，请确保在微信小游戏环境中运行';
        }
      } catch (e) {
        document.getElementById('logs').textContent = '错误: ' + e.message;
      }
    }
    
    function clearLogs() {
      try {
        if (typeof GameGlobal !== 'undefined' && GameGlobal.clearConsoleLogs) {
          GameGlobal.clearConsoleLogs();
          document.getElementById('logs').textContent = '日志已清空';
        }
      } catch (e) {}
    }
    
    // 自动加载
    loadLogs();
  </script>
</body>
</html>
