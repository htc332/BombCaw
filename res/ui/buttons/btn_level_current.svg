      </feMerge>
    </filter>
  </defs>
  <circle cx="40" cy="40" r="38" fill="none" stroke="url(#goldBorder)" stroke-width="4" filter="url(#lvlGlow)"/>
  <circle cx="40" cy="40" r="34" fill="url(#lvlGradC)"/>
  <text x="40" y="46" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFF" text-anchor="middle">5</text>
